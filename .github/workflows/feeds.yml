name: Обновление данных

# Keeps the data the site cannot fetch from a browser fresh, without anyone's computer:
# fed.json (odds for each Fed meeting from Kalshi, the target range from FRED),
# levels.json (bitcoin's realized price from BGeometrics), liq.json (stablecoin supply from DefiLlama),
# tokens.json (protocol revenue from DefiLlama, supply and market value from CoinGecko) and
# macro.json (M2 of the largest economies, central bank balance sheets, the Fed's net liquidity: FRED, the ECB,
# the Bank of Japan, Eastmoney for China).
# The result goes to the "data" branch, which the site reads; a copy is committed to main about once a day.
# GitHub's own schedule starts this workflow about once a day instead of every hour, so the workflow keeps itself going:
# every run books the next one (the "next" job at the bottom). The schedule and the pushes below only restart the chain
# if it ever breaks. Each file is refreshed only when it has aged: a run with nothing to do ends in seconds.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Перечитать всё, даже если данные свежие"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/feeds.yml"
      - "tools/feeds.py"
      - "fed-calendar.json"
      - "data.json"          # the morning report's push also refreshes the feeds: a backstop for a skipped schedule

permissions:
  contents: write

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: feeds
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Взять прошлые данные
        run: |
          echo "MAIN_STAMP=$(python3 -c "import json; print(json.load(open('fed.json')).get('updated') or '')" 2>/dev/null || true)" >> "$GITHUB_ENV"
          if git fetch --quiet --depth=1 origin data 2>/dev/null; then
            echo "DATA_TREE=$(git rev-parse 'FETCH_HEAD^{tree}')" >> "$GITHUB_ENV"
            for f in fed.json levels.json liq.json tokens.json macro.json; do
              git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/$f" 2>/dev/null && cp "$RUNNER_TEMP/$f" "$f" || true
            done
          fi
      - name: Обновить данные
        env:
          FORCE_LEVELS: ${{ inputs.force }}
        run: python3 tools/feeds.py
      - name: Опубликовать в ветке data
        run: |
          python3 -c "import json; json.load(open('fed.json'))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in levels.json liq.json tokens.json macro.json; do
            if [ -s "$f" ]; then python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f"; fi
          done
          tree=$(for f in fed.json levels.json liq.json tokens.json macro.json; do if [ -s "$f" ]; then printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$f"; fi; done | git mktree)
          if [ "$tree" = "${DATA_TREE:-}" ]; then
            echo "Данные не изменились"
            exit 0
          fi
          commit=$(git commit-tree "$tree" -m "Данные: $(date -u +%FT%H:%MZ)")
          git push --quiet --force origin "$commit:refs/heads/data"
      - name: Раз в сутки сохранить копию в main
        run: |
          due=$(python3 -c "
          import datetime as dt, os
          s = os.environ.get('MAIN_STAMP', '')
          try:
              age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(s.replace('Z', '+00:00'))).total_seconds()
          except ValueError:
              age = 1e9
          # the 03:xx UTC run, far from the morning report's own push; or any run if a day was missed
          print('yes' if (dt.datetime.now(dt.timezone.utc).hour == 3 and age > 12 * 3600) or age > 30 * 3600 else 'no')")
          # routine runs (the schedule and the runs this workflow books for itself) copy once a day;
          # a push or a forced manual run copies at once
          routine=no
          if [ "${{ github.event_name }}" = "schedule" ]; then routine=yes; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "true" ]; then routine=yes; fi
          if [ "$due" != "yes" ] && [ "$routine" = "yes" ]; then
            echo "Копия в main свежая"
            exit 0
          fi
          for f in levels.json liq.json tokens.json macro.json; do
            if [ -s "$f" ]; then git add "$f"; fi
          done
          git add fed.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit --quiet -m "Данные: $(date -u +%F)"
          git pull --quiet --rebase origin main
          git push --quiet origin HEAD:main

  # The next run, about 50 minutes later. The job waits out the timer of the "tick" environment (repository settings:
  # Environments, tick, wait timer; no machine is held while it waits) and then starts this workflow again.
  # A newer run cancels the older run's waiting job, so there is always one booking, never two.
  # If the timer is ever removed, the check below refuses to start runs back to back.
  next:
    needs: feeds
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: tick
    concurrency:
      group: feeds-next
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - name: Назначить следующий запуск
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_GAP: "40"
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .run_started_at)
          gap=$(( ($(date +%s) - $(date -d "$started" +%s)) / 60 ))
          if [ "$gap" -lt "$MIN_GAP" ]; then
            echo "С начала запуска прошло $gap мин: таймер окружения tick не настроен, следующий запуск не назначаю"
            exit 0
          fi
          gh workflow run feeds.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Следующий запуск назначен, прошло $gap мин"
