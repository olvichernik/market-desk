name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py
      - run: |
          rm -f samples/stables.json
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add samples
          git commit -q -m "probe: samples"
          git push -q origin HEAD:probe
